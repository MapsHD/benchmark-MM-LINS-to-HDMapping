# Benchmark canonical bag (Hesai QT64 as sensor_msgs/PointCloud2: x y z intensity,
# ring, float32 time [s] relative to the header stamp, uint32 t [ns]; IMU in the
# lidar frame). MM-LINS's own ouster64.yaml with only the sensor description
# changed: topics, 64 rings, 0.5 m blind, 360 deg, 60 m range (as in the FAST-LIO
# canonical config). lidar_type 3 (Ouster) reads the uint32 `t` in ns; the
# velodyne handler would read `time` as microseconds. Extrinsic already identity.
common:
    lid_topic:  "/lidar/pointcloud"
    imu_topic:  "/lidar/imu"
    time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
    
preprocess:
    lidar_type: 3                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 
    scan_line: 64
    blind: 0.5

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    360
    det_range:     60.0
    extrinsic_T: [ 0.0, 0.0, 0.0 ]
    extrinsic_R: [1, 0, 0,
                  0, 1, 0,
                  0, 0, 1]

publish:     
    scan_publish_en:  true       # 'false' will close all the point cloud output
    dense_publish_en: ture       # false will low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # output the point cloud scans in IMU-body-frame